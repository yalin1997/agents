<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Workspace</title><link rel="stylesheet" href="/app.css"></head><div class="app">
<nav class="sidebar" id="sidebar" aria-label="任務"><div class="brand"><span class="logo" aria-hidden="true">π</span>Pi Workspace</div><div class="sidebar-head"><span class="eyebrow">任務</span><button class="icon-button" id="new" title="新增任務" aria-label="新增任務" data-icon="plus"></button></div><div class="session-views" aria-label="對話分類"><button id="view-active" aria-pressed="true">對話</button><button id="view-archived" aria-pressed="false">封存區</button></div><div id="archive-controls" hidden><button id="select-all" class="secondary">全選</button><button id="purge-open" class="secondary">永久刪除已選項目（0）</button></div><div id="task-list"></div><div class="side-note"><button id="login-open" class="account-button"><span class="avatar" data-icon="lock"></span><span>管理員登入</span></button><div id="identity-row" class="account-row hidden"><div class="identity"><span class="avatar" data-icon="user"></span><div><strong>admin</strong><small>管理員</small></div></div><button id="logout" class="icon-button" aria-label="登出" title="登出" data-icon="logout"></button></div></div></nav>
<main><header class="topbar"><button class="mobile-nav icon-button" id="menu" aria-label="任務列表" title="任務列表" aria-expanded="false" aria-controls="sidebar" data-icon="menu"></button><h1 id="title" tabindex="-1">Pi Workspace</h1><span class="pill" id="badge" role="status"></span><button id="artifacts-open" class="artifact-toggle" aria-label="開啟成果" aria-controls="artifact-panel" aria-expanded="false" hidden><span data-icon="file"></span><span id="artifact-count"></span></button></header><div class="conversation-heading"><span data-icon="chat"></span>對話</div><section class="content" id="content" aria-label="任務內容"></section><div class="composer-wrap"><div class="composer"><label class="sr-only" for="prompt">輸入需求</label><textarea id="prompt" placeholder="想完成什麼？"></textarea><div class="compose-actions"><button class="primary icon-button" id="send" aria-label="送出" title="送出" data-icon="send"></button></div></div><p class="hint" id="workspace-note"></p><div class="statusline" id="feedback" aria-live="polite"></div></div></main>
<aside class="inspector" id="artifact-panel" aria-label="成果檔案"><div class="artifact-heading"><h2><span data-icon="file"></span>成果</h2><button id="artifact-close" class="icon-button" aria-label="關閉成果" title="關閉成果" data-icon="close"></button></div><div id="aside-result"></div></aside></div>
<dialog id="login-dialog" class="auth-dialog" aria-labelledby="login-title" aria-describedby="login-note"><div class="auth-heading"><h2 id="login-title">管理員登入</h2><button type="button" id="login-close" class="icon-button" aria-label="關閉登入" title="關閉" data-icon="close"></button></div><form id="login-form"><label for="username">帳號</label><input id="username" name="username" value="admin" readonly autocomplete="username"><label for="password">密碼</label><input id="password" type="password" required autocomplete="current-password" aria-describedby="login-note login-error"><p id="login-error" class="auth-error" role="alert"></p><button class="primary" type="submit">登入</button><p id="login-note" class="auth-note">僅限管理員使用。</p></form></dialog>
<dialog id="retry-dialog" class="auth-dialog" aria-labelledby="retry-title" aria-describedby="retry-note"><h2 id="retry-title">重試這項工作？</h2><p id="retry-note">可能再次執行已做過的操作。請先檢查已產生的檔案或命令結果。</p><div class="dialog-actions"><button type="button" class="secondary" id="retry-cancel">取消</button><button type="button" class="primary" id="retry-confirm">重試</button></div></dialog><dialog id="purge-dialog" class="auth-dialog" aria-labelledby="purge-title" aria-describedby="purge-note"><h2 id="purge-title">永久刪除對話？</h2><p id="purge-note"></p><div class="dialog-actions"><button id="purge-cancel" class="secondary" type="button">取消</button><button id="purge-confirm" class="danger" type="button">永久刪除</button></div></dialog><script type="module" src="/app.js"></script></body></html>
