[project]
name = "pi-deepagent"
version = "0.1.0"
description = "A Pi Coding Agent-inspired coding assistant implemented with langchain-ai Deep Agents."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "deepagents>=0.7.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=3.0.0",
]

[project.scripts]
pi-deepagent = "pi_deepagent.cli:main"
pi-a2a = "pi_deepagent.a2a.cli:main"

[project.optional-dependencies]
a2a = [
    "a2a-sdk[http-server,sqlite]==1.2.3",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
