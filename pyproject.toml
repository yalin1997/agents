[project]
name = "pi-deepagent"
version = "0.1.0"
description = "A Pi Coding Agent-inspired coding assistant implemented with langchain-ai Deep Agents."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=3.0.0",
]

[project.scripts]
pi-deepagent = "pi_deepagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
